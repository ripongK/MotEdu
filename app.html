<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอปสาธิต เช็คชื่อนักเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Prompt:wght@500;600;700&family=Sriracha&family=Itim&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ===================== ธีม (ผู้ใช้เลือกเองได้ที่ปุ่ม 🎨) ===================== */
:root,[data-theme="mallsoft"]{--bg:#F6F7F9;--card:#fff;--ink:#1F2933;--mut:#5B6470;--line:#E5E7EB;--pri:#F26A1B;--pri-ink:#fff;--pri-soft:#FFF1E8;--pri-dk:#B4480C;
  --top:#2B2F36;--top-ink:#fff;--ok:#15803D;--okb:#DCFCE7;--late:#B45309;--lateb:#FEF3C7;--bad:#B91C1C;--badb:#FEE2E2;--sick:#1D4ED8;--sickb:#DBEAFE;--per:#7E22CE;--perb:#F3E8FF;
  --wait:#6B7280;--waitb:#F3F4F6;--r:14px;--fh:"Prompt","Sarabun",sans-serif;--fb:"Sarabun",system-ui,sans-serif;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);color-scheme:light}
[data-theme="backboard"]{--bg:#27443A;--card:rgba(255,255,255,.07);--ink:#F4F1E6;--mut:#C9D6CC;--line:rgba(255,255,255,.22);--pri:#F5E27A;--pri-ink:#2a2a1a;--pri-soft:rgba(245,226,122,.16);--pri-dk:#F5E27A;
  --top:#6E4522;--top-ink:#FFF6E5;--ok:#9BE7A8;--okb:rgba(155,231,168,.16);--late:#FFD58A;--lateb:rgba(255,213,138,.16);--bad:#FF9E9E;--badb:rgba(255,158,158,.16);--sick:#9CC8FF;--sickb:rgba(156,200,255,.16);
  --per:#E2B6FF;--perb:rgba(226,182,255,.16);--wait:#C9D6CC;--waitb:rgba(255,255,255,.08);--r:6px;--fh:"Sriracha","Itim",sans-serif;--fb:"Itim","Sarabun",sans-serif;--sh:none;color-scheme:dark}
[data-theme="sky"]{--bg:#F0F7FF;--card:#fff;--ink:#0F2A44;--mut:#4F6478;--line:#D6E6F5;--pri:#1E78D6;--pri-ink:#fff;--pri-soft:#E3F0FD;--pri-dk:#145BA6;--top:#0F4C8A;--top-ink:#fff;--r:18px}
[data-theme="mint"]{--bg:#F1FAF6;--card:#fff;--ink:#12332A;--mut:#4C6B61;--line:#D3EBE1;--pri:#0E9F6E;--pri-ink:#fff;--pri-soft:#DDF5EA;--pri-dk:#0A7752;--top:#0B5C45;--top-ink:#fff;--r:18px}
[data-theme="sakura"]{--bg:#FFF5F8;--card:#fff;--ink:#3A1F2B;--mut:#7A5867;--line:#F6DCE6;--pri:#DB2777;--pri-ink:#fff;--pri-soft:#FCE7F1;--pri-dk:#A21B59;--top:#8E2453;--top-ink:#fff;--r:22px}
[data-theme="royal"]{--bg:#F5F5F0;--card:#fff;--ink:#1B2238;--mut:#575E73;--line:#E2E1D8;--pri:#1F3A8A;--pri-ink:#fff;--pri-soft:#E7ECF8;--pri-dk:#162B66;--top:#13234F;--top-ink:#F4D27A;--r:10px;--fh:"Sarabun",sans-serif}
[data-theme="night"]{--bg:#12151A;--card:#1B2027;--ink:#E7EAEE;--mut:#A3ACB7;--line:#2E3640;--pri:#FF8A45;--pri-ink:#1a1209;--pri-soft:#3A2618;--pri-dk:#FFB088;--top:#0B0D10;--top-ink:#fff;
  --ok:#6BD49A;--okb:#183326;--late:#F2C25B;--lateb:#3A2F12;--bad:#F59389;--badb:#3D1F1C;--sick:#93B4FF;--sickb:#1E2A47;--per:#D3A6FF;--perb:#2E1F42;--wait:#A3ACB7;--waitb:#252B33;--sh:none;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15.5px;line-height:1.55;min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
[data-theme="backboard"] body{background-color:#27443A;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px),radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.18),transparent 55%);background-size:6px 6px,100% 100%,100% 100%;background-attachment:fixed}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.3;font-weight:600}
h2{font-size:18px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri-dk)}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:700}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* ส่วนหัว */
.top{position:sticky;top:0;z-index:20;background:var(--top);color:var(--top-ink);display:flex;align-items:center;gap:10px;
  padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top))}
[data-theme="backboard"] .top{background:linear-gradient(180deg,#8A5A2E,#6E4522 60%,#5A381C);box-shadow:0 3px 0 #3E2712,0 6px 14px rgba(0,0,0,.35)}
.top .logo{width:34px;height:34px;border-radius:50%;background:#fff center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:18px}
.top .tt{min-width:0;flex:1}
.top .tt b{display:block;font-family:var(--fh);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt span{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{background:rgba(255,255,255,.12);border:0;color:inherit;border-radius:10px;width:38px;height:38px;font-size:18px;flex:none}
[data-theme="backboard"] .eraser{display:block}
.eraser{display:none;width:34px;height:16px;border-radius:3px;background:linear-gradient(180deg,#f2efe6 0 45%,#3b5aa6 45%);box-shadow:0 2px 0 rgba(0,0,0,.3);flex:none;transform:rotate(-8deg)}

main{max-width:1080px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) 20px max(14px,env(safe-area-inset-left))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);position:relative}
[data-theme="backboard"] .card{border:2px dashed rgba(255,255,255,.28)}
[data-theme="backboard"] .card.pin::before{content:"";position:absolute;top:-9px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8a8a,#d22 55%,#8a0000);box-shadow:0 3px 4px rgba(0,0,0,.4)}
[data-theme="backboard"] .card.clip::after{content:"";position:absolute;top:-12px;right:22px;width:14px;height:34px;border:3px solid #c9ccd1;border-radius:8px;border-bottom-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:44px}
[data-theme="backboard"] input,[data-theme="backboard"] select,[data-theme="backboard"] textarea{background:rgba(0,0,0,.18);color:var(--ink)}
[data-theme="backboard"] option{background:#27443A}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.soft{background:var(--pri-soft);color:var(--pri-dk);border-color:transparent}
.btn.ok-btn{background:var(--okb);color:var(--ok);border-color:var(--ok);font-weight:700}
.btn.bad{background:var(--badb);color:var(--bad);border-color:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
[data-theme="backboard"] .btn{border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--waitb);color:var(--wait);white-space:nowrap}
.st-present{background:var(--okb);color:var(--ok)}.st-late{background:var(--lateb);color:var(--late)}.st-absent{background:var(--badb);color:var(--bad)}
.st-sick{background:var(--sickb);color:var(--sick)}.st-personal{background:var(--perb);color:var(--per)}.st-null{background:var(--waitb);color:var(--wait)}
.alert{padding:11px 14px;border-radius:12px;margin-bottom:12px;font-size:14px;background:var(--pri-soft);color:var(--ink);border:1px solid var(--line)}
.alert.warn{background:var(--lateb)}.alert.bad{background:var(--badb)}.alert.ok{background:var(--okb)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--mut);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.tot td{font-weight:700;background:var(--pri-soft)}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:11px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}

/* หน้าหลัก */
.hero{display:flex;gap:14px;align-items:center}
.hero .lg{width:64px;height:64px;border-radius:50%;background:#fff center/cover no-repeat;flex:none;border:2px solid var(--line);display:grid;place-items:center;font-size:30px}
.hero h1{font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh)}
.tile i{font-style:normal;font-size:26px}
.tile b{font-family:var(--fh);font-size:15.5px}
.tile span{font-size:12.5px;color:var(--mut)}
.tile.hot{border-color:var(--pri);background:var(--pri-soft)}
[data-theme="backboard"] .tile{border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.kpi{border-radius:12px;padding:10px 12px;background:var(--waitb)}
.kpi b{display:block;font-size:24px;font-family:var(--fh);line-height:1.2}
.kpi span{font-size:12.5px}
.kpi small{display:block;font-size:11.5px;opacity:.85}

/* เช็คชื่อ */
.sumtbl td,.sumtbl th{text-align:center;padding:6px 4px}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.stu{display:grid;grid-template-columns:34px 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.stu .no{font-weight:700;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.stu .nm{min-width:0;cursor:pointer}
.stu .nm b{font-weight:600}
.stu .nm small{display:block;font-size:12px;color:var(--mut)}
.stu .seg{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 9px;font-size:13px;min-height:36px;min-width:50px}
.seg button.on.present{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on.late{background:var(--late);color:#fff;border-color:var(--late)}
.seg button.on.absent{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.on.sick{background:var(--sick);color:#fff;border-color:var(--sick)}
.seg button.on.personal{background:var(--per);color:#fff;border-color:var(--per)}
[data-theme="backboard"] .seg button.on,[data-theme="night"] .seg button.on{color:#1a1a1a!important}
.stu .why{grid-column:2}
.stu.pending .nm b::after{content:" · ยังไม่เช็ค (ขาด)";font-weight:400;font-size:12px;color:var(--bad)}
@media (min-width:760px){.stu{grid-template-columns:34px minmax(180px,1fr) auto}.stu .seg{grid-column:3}.stu .why{grid-column:2/4}}
@media (min-width:760px) and (min-height:700px){.sticky-sum{position:sticky;top:58px;z-index:5}}
.savebar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.14)}
[data-theme="backboard"] .savebar{background:#1f382f}
.badge{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--waitb);color:var(--mut)}
.badge.ok{background:var(--okb);color:var(--ok)}.badge.full{background:var(--lateb);color:var(--late)}
.dots{display:flex;gap:6px}
.dot{width:34px;text-align:center;font-size:11px;color:var(--mut)}
.dot i{display:block;width:26px;height:26px;margin:0 auto 2px;border-radius:50%;background:var(--waitb);font-style:normal;line-height:26px;font-size:13px}
.dot i.present{background:var(--ok);color:#fff}.dot i.late{background:var(--late);color:#fff}.dot i.absent{background:var(--bad);color:#fff}.dot i.sick{background:var(--sick);color:#fff}.dot i.personal{background:var(--per);color:#fff}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--pri-soft);color:var(--pri-dk);flex:none}
.bar{height:10px;border-radius:99px;background:var(--waitb);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev .d{flex:none;width:56px;text-align:center;border-radius:10px;background:var(--pri-soft);color:var(--pri-dk);padding:4px 0;font-weight:700;line-height:1.15}
.ev .d small{display:block;font-size:11px;font-weight:600}
.otpbig{font-family:var(--fh);font-size:44px;letter-spacing:10px;text-align:center;padding:10px;border:2px dashed var(--pri);border-radius:14px;background:var(--pri-soft);color:var(--pri-dk)}
.roombars{display:grid;gap:6px}
.roombars .rb{display:grid;grid-template-columns:58px 1fr 52px;gap:8px;align-items:center;font-size:13px}

/* เมนูล่าง */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
[data-theme="backboard"] .nav{background:#5A381C;border-top:3px solid #3E2712}
.nav button{flex:1;max-width:130px;border:0;background:none;padding:8px 4px 7px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button i{font-style:normal;font-size:21px;line-height:1.1}
.nav button.on{color:var(--pri-dk);font-weight:700}
[data-theme="backboard"] .nav button{color:#e9dcc6}[data-theme="backboard"] .nav button.on{color:#F5E27A}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
[data-theme="backboard"] .modal .box{background:#2c4a3f}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;max-width:92vw;background:#1f2933;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.toast.on{display:block}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.themes button{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:var(--card);text-align:left}
.themes button.on{border-color:var(--pri)}
.themes .sw{height:54px;display:flex}
.themes .sw i{flex:1}
.themes b{display:block;padding:7px 10px 0;font-size:14px}
.themes span{display:block;padding:0 10px 8px;font-size:12px;color:var(--mut)}
.foot{text-align:center;font-size:12px;color:var(--mut);margin:18px 0 6px}
.demo-ribbon{background:repeating-linear-gradient(45deg,#FDE68A,#FDE68A 10px,#FCD34D 10px,#FCD34D 20px);color:#422006;font-size:12.5px;text-align:center;padding:4px 8px;font-weight:600}
.a4sheet{background:#fff;color:#000;max-width:794px;margin:12px auto;padding:48px 44px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-family:'TH Sarabun New','Sarabun',sans-serif;font-size:14pt;line-height:1.35}
.a4sheet table{width:100%;border-collapse:collapse;margin:6px 0}.a4sheet th,.a4sheet td{border:1px solid #777;padding:3px 6px;font-size:12.5pt;color:#000}.a4sheet th{background:#eee}.a4sheet h3{font-size:15pt;margin:14px 0 4px;color:#000}
.a4sheet table.sig,.a4sheet table.sig td{border:0}.a4sheet table.sig td{text-align:center;padding-top:30px}
@media(max-width:700px){.a4sheet{padding:18px 10px;font-size:11pt;overflow-x:auto}.a4sheet th,.a4sheet td{font-size:9.5pt;padding:2px 3px}}
@page{size:A4;margin:1.6cm 1.4cm}
@media print{.top,.nav,.savebar,.rep-tools,.toast,.modal,#demoRibbon{display:none!important}body{background:#fff!important;padding:0!important}.a4sheet{box-shadow:none;margin:0;padding:0;max-width:none}main,.wrap{padding:0!important;margin:0!important}}
</style>
</head>
<body>
<div class="demo-ribbon hide" id="demoRibbon">โหมดสาธิต — ข้อมูลสมมุติ ไม่บันทึกจริง</div>
<header class="top">
  <div class="logo" id="hLogo">🏫</div>
  <div class="tt"><b id="hSchool">เช็ครายชื่อนักเรียนประจำวัน</b><span id="hSub">MallsofT</span></div>
  <div class="eraser" aria-hidden="true"></div>
  <button class="ibtn" id="btnTheme" aria-label="เลือกธีม">🎨</button>
</header>
<main id="view"><div class="spin"></div><p class="mut" style="text-align:center" id="loadMsg">กำลังเชื่อมต่อ LINE...</p></main>
<nav class="nav hide" id="nav" aria-label="เมนูหลัก"></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   MallsofT เช็ครายชื่อนักเรียนประจำวัน — ข้อมูลจำลองสำหรับโหมดสาธิต (เว็บไซต์ขาย)
   ทำงานในเบราว์เซอร์ทั้งหมด ไม่เชื่อมต่อเซิร์ฟเวอร์ ข้อมูลเป็นบุคคลสมมุติ
   เลือกบุคคลด้วย ?as=admin|teacher|otp|head|affairs|exec|parent|new
   ===================================================================== */
(function () {
  let seed = 20260517;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const pick = a => a[Math.floor(rnd() * a.length)];

    importStudents(p) {
      reqRole(['admin','registrar']); const errors = []; const ok = [];
      p.rows.forEach((r, i) => { const lv = String(r.level).replace(/\s/g, ''); const g = /^(ช|ชาย|M|ด\.ช|เด็กชาย|นาย)/i.test(r.gender) ? 'M' : /^(ญ|หญิง|F|ด\.ญ|เด็กหญิง|นางสาว)/i.test(r.gender) ? 'F' : '';

    genOtp(p) { const t = reqRole(['admin']); if (p.day < TODAY) err('สร้างรหัสย้อนหลังไม่ได้'); let code; do code = String(Math.floor(rnd() * 1e6)).padStart(6, '0'); while (otps.some(o => o.code === code && !o.done_at && !o.revoked));

    revokeOtp(p) { reqRole(['admin']); otps.find(o => o.id === p.id).revoked = true; return { ok: true }; },

  };

/* ------------------ ส่วนช่วย ------------------ */
function toast(msg, ms = 3500) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }
function modal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
window.addEventListener('unhandledrejection', e => e.preventDefault()); // ข้อผิดพลาดแสดงใน toast แล้ว
function openUrl(url) { if (!DEV && !DEMO && window.liff && liff.isInClient && liff.isInClient()) liff.openWindow({ url, external: true }); else window.open(url, '_blank'); }
async function api(action, payload = {}) {
  if (DEMO) return window.DEMO_API(action, JSON.parse(JSON.stringify(payload)));
  const body = { action, ...payload };
  if (DEV) { body.devUserId = DEV; body.devName = qs.get('name') || 'ผู้ทดสอบ'; } else body.idToken = liff.getIDToken();
  const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (รหัส ' + r.status + ') กรุณาลองใหม่' }));
  if (!j.ok) { if (!DEV && /หมดอายุ/.test(j.error || '')) { liff.logout(); liff.login({ redirectUri: location.href }); } throw new Error(j.error); }
  return j.data;
}
async function gas(payload) {
  const body = { ...payload };
  if (DEV) { body.devUserId = DEV; body.devName = qs.get('name') || 'ผู้ทดสอบ'; } else body.idToken = liff.getIDToken();
  const r = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ ok: false, error: 'เชื่อมต่อ Google ไม่ได้' }));
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function run(btn, fn, okMsg) {
  if (btn) { btn.disabled = true; btn._t = btn.innerHTML; btn.innerHTML = '⏳ กำลังดำเนินการ...'; }
  try { const r = await fn(); if (okMsg) toast('✓ ' + okMsg); return r; }
  catch (e) { toast('✕ ' + e.message, 6000); throw e; }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = btn._t; } }
}

const canDash = () => isTeacher() && (ME.teacher.viewRooms.length > 0 || ME.teacher.advisorRooms.length > 0);

function pctOf(c, day) { const base = day ? c.total - c.unchecked : c.student_days; return base ? Math.round(1000 * (c.present + c.late) / base) / 10 : 0; }

async function boot() {
  try {
    if (DEMO) $('demoRibbon').classList.remove('hide');
    if (!DEV && !DEMO) {
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    }
    $('loadMsg').textContent = 'กำลังโหลดข้อมูล...';
    await reloadMe();
    if (qs.get('export')) { if (await openExportLink()) return; }
    const start = qs.get('view') || location.hash.slice(1);
    if (!ME.teacher && !ME.parent) return vRegister();
    go(['dash','parent','admin','room'].includes(start) ? start : 'home');

async function reloadMe() {
  ME = await api('me');

  $('hSub').textContent = ME.term ? termText() : (ME.school.aff1 || 'MallsofT');

function buildNav() {
  const items = [['home','🏠','หน้าหลัก']];
  if (myRooms().length) items.push(['room','✅','เช็คชื่อ']);
  if (canDash()) items.push(['dash','📊','แดชบอร์ด']);
  if (ME.parent) items.push(['parent','👨‍👩‍👧','บุตรหลาน']);
  if (canAdmin()) items.push(['admin','🛡️','ผู้ดูแล']);
  const nav = $('nav');
  nav.innerHTML = items.map(([v,i,t]) => `<button data-v="${v}"><i>${i}</i>${t}</button>`).join('');
  nav.classList.toggle('hide', items.length < 2 && !ME.teacher && !ME.parent);

function go(v, opt = {}) {
  if (S.dirty && S.view === 'room' && !confirm('ยังไม่ได้บันทึกการเช็คชื่อ ต้องการออกจากหน้านี้หรือไม่?')) return;
  S.dirty = false; S.view = v;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'home') return vHome();
  if (v === 'room') { if (opt.room) { S.room = opt.room; S.tab = 'check'; S.day = ME.today; } return vRoom(); }
  if (v === 'dash') return vDash();

}

  const mode = rooms.find(r => r.code === S.room).mode;
  const tabs = mode === 'otp' ? [['check','เช็คชื่อ'],['cal','ปฏิทินห้อง']] : [['check','เช็คชื่อ'],['sum','สรุปห้อง'],['leave','การลา'],['parents','ผู้ปกครอง'],['cal','ปฏิทินห้อง']];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'check';
  view(`${rooms.length > 1 ? `<div class="tabs" id="roomSel">${rooms.map(r => `<button data-r="${r.code}" class="${r.code === S.room ? 'on' : ''}">${r.mode === 'otp' ? '🔑 ' : ''}${esc(r.code)}</button>`).join('')}</div>` : ''}
    <div class="row" style="margin-bottom:8px"><h2>ห้อง ${esc(S.room)}</h2>${mode === 'otp' ? '<span class="chip st-late">ครูแทน (OTP)</span>' : ''}</div>
    <div class="tabs" id="roomTabs">${tabs.map(([k,n]) => `<button data-t="${k}" class="${k === S.tab ? 'on' : ''}">${n}</button>`).join('')}</div><div id="roomBody"><div class="spin"></div></div>`);
  document.querySelectorAll('#roomSel button').forEach(b => b.onclick = () => { if (S.dirty && !confirm('ยังไม่ได้บันทึก ต้องการเปลี่ยนห้องหรือไม่?')) return; S.dirty = false; S.room = b.dataset.r; S.day = ME.today; vRoom(); });
  document.querySelectorAll('#roomTabs button').forEach(b => b.onclick = () => { if (S.dirty && !confirm('ยังไม่ได้บันทึก ต้องการเปลี่ยนแท็บหรือไม่?')) return; S.dirty = false; S.tab = b.dataset.t; vRoom(); });
  try {
    if (S.tab === 'check') await tCheck();
    if (S.tab === 'sum') await tRoomSum();
    if (S.tab === 'leave') await tLeave();
    if (S.tab === 'parents') await tParents();
    if (S.tab === 'cal') await tCal(mode);
  } catch (e) { $('roomBody').innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; }
}

async function tCheck() {
  const R = S.roster = await api('roster', { classroom: S.room, day: S.day });
  // นักเรียนที่ผู้ปกครองแจ้งลาไว้ ตั้งเป็นลาให้อัตโนมัติ (ครูแก้ได้)
  R.students.forEach(s => { s.orig = s.status; if (!s.status && s.leave) { s.status = s.leave.kind; s.reason = '(ผู้ปกครองแจ้ง) ' + s.leave.reason; S.dirty = true; } });
  const pos = R.countMode === 'week' ? `สัปดาห์ที่ ${R.term.weekNo || '-'}` : `วันเรียนที่ ${R.term.dayNo || '-'}`;
  const leaves = R.students.filter(s => s.leave && s.leave.status === 'pending');
  $('roomBody').innerHTML = `
    <div class="card clip"><div class="row"><div><b>${thDate(R.day, true)}</b><div class="mut sm">${esc(R.termLabel)} · ${pos} · สายหลัง ${esc(R.lateTime)} น.</div></div><span class="sp"></span>
      ${R.mode === 'otp' ? '' : `<input type="date" id="cDay" value="${R.day}" max="${ME.today}" style="width:auto">`}</div>
      ${R.checked ? `<div class="alert ok" style="margin:10px 0 0">เช็คแล้วเมื่อ ${new Date(R.checked.first_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} น.${R.checked.via === 'otp' ? ' (โดยครูแทน)' : ''} — นักเรียนที่มาเพิ่มภายหลังจะถูกตั้งเป็น "มาสาย" อัตโนมัติ</div>`
        : R.isLateNow ? `<div class="alert warn" style="margin:10px 0 0">เลยเวลา ${esc(R.lateTime)} น. แล้ว นักเรียนที่แตะชื่อจะเป็น "มาสาย" (เปลี่ยนเป็น "ปกติ" ได้)</div>` : ''}
      ${leaves.length ? `<div class="alert" style="margin:10px 0 0">📩 ผู้ปกครองแจ้งลา ${leaves.length} คน ระบบตั้งสถานะให้แล้ว</div>` : ''}
      ${!R.canEdit ? `<div class="alert warn" style="margin:10px 0 0">ดูได้อย่างเดียว</div>` : ''}</div>
    <div class="card sticky-sum" id="sumBox"></div>
    <div class="card"><div class="row" style="margin-bottom:6px"><h3>รายชื่อนักเรียน (${R.students.length} คน)</h3><span class="sp"></span>
      ${R.canEdit && R.showAllPresent !== false && R.students.length ? `<button class="btn sm ok-btn" id="allPresent" title="ตั้งนักเรียนทุกคนเป็นมาปกติในครั้งเดียว แล้วค่อยแก้เฉพาะคนที่ขาด/สาย/ลา">✓ ครบ(ปกติ)</button>` : ''}</div>
      <p class="mut sm" style="margin:0 0 6px">แตะชื่อเพื่อสลับ มา/ขาด · ยังไม่เช็ค = ขาดเรียน (รอ) · ไอคอน 👪 คือจำนวนบัญชีผู้ปกครองที่ดูข้อมูลได้</p>
      <div id="stuList"></div></div>
    ${R.canEdit ? `<div class="savebar"><div class="sm" id="saveInfo" style="align-self:center;flex:1"></div>
      ${R.mode === 'otp' ? `<button class="btn" id="btnSave">บันทึก</button><button class="btn pri" id="btnFinish">ส่งยอดและจบภารกิจ</button>` : `<button class="btn pri" id="btnSave">💾 บันทึกการเช็คชื่อ</button>`}</div>` : ''}`;
  if ($('cDay')) $('cDay').onchange = e => { if (S.dirty && !confirm('ยังไม่ได้บันทึก ต้องการเปลี่ยนวันหรือไม่?')) { e.target.value = S.day; return; } S.dirty = false; S.day = e.target.value || ME.today; vRoom(); };
  renderStudents(); renderSum();
  if ($('allPresent')) $('allPresent').onclick = () => allPresent(R);
  if ($('btnSave')) $('btnSave').onclick = e => saveRoster(e.target, false);
  if ($('btnFinish')) $('btnFinish').onclick = e => saveRoster(e.target, true);

// ปุ่ม "ครบ(ปกติ)": ตั้งนักเรียนทั้งห้องเป็นมาปกติ (ครูยังแก้รายคนได้ก่อนกดบันทึก)
function allPresent(R) {
  const other = R.students.filter(s => s.status && s.status !== 'present');
  let all = true;
  if (other.length) all = confirm(`มีนักเรียน ${other.length} คนที่ระบุสถานะไว้แล้ว (ขาด/สาย/ลา)\n\nกด "ตกลง" = เปลี่ยนทุกคนเป็นมาปกติ\nกด "ยกเลิก" = คงสถานะ ${other.length} คนนี้ไว้ ตั้งเฉพาะคนที่เหลือ`);
  let n = 0;
  R.students.forEach(s => { if (s.status === 'present') return; if (!s.status || all) { s.status = 'present'; s.reason = ''; n++; } });
  S.dirty = true; renderStudents(); renderSum();
  toast(n ? `✓ ตั้ง ${n} คนเป็น "มาปกติ" แล้ว แก้รายคนได้ แล้วกด "บันทึก"` : 'ทุกคนเป็น "มาปกติ" อยู่แล้ว', 4500);
}
function nextStatus(s) {
  const R = S.roster;
  if (!s.status || s.status === 'absent') return (R.checked || R.isLateNow) && s.orig !== 'present' ? 'late' : 'present';
  if (s.status === 'present' || s.status === 'late') return 'absent';
  return s.status;
}
function renderStudents() {
  const R = S.roster;
  $('stuList').innerHTML = R.students.map((s, i) => {
    const pend = !s.status;
    const btns = ['present','late','absent','sick','personal'].map(k => `<button data-i="${i}" data-s="${k}" class="${k} ${s.status === k ? 'on' : ''}" ${R.canEdit ? '' : 'disabled'}>${ST_S[k]}</button>`).join('');
    const pb = `<span class="badge ${s.parents >= ME.school.quota ? 'full' : s.parents ? 'ok' : ''}" title="บัญชีผู้ปกครอง">👪 ${s.parents}</span>`;
    const why = ['sick','personal','late','absent'].includes(s.status) ? `<div class="why"><input type="text" data-why="${i}" value="${esc(s.reason)}" placeholder="${s.status === 'sick' || s.status === 'personal' ? 'เหตุผลการลา (จำเป็น) เช่น ลาไปทำฟัน, แข่งฟุตบอล' : 'หมายเหตุ (ถ้ามี)'}" ${R.canEdit ? '' : 'disabled'} aria-label="เหตุผล"></div>` : '';
    return `<div class="stu ${pend ? 'pending' : ''}"><div class="no">${s.number || ''}</div>
      <div class="nm" data-tap="${i}"><b>${s.gender === 'M' ? '👦' : '👧'} ${esc(s.name)}</b> ${pb}${s.leave ? ` <span class="chip st-${s.leave.kind}">📩 ${ST[s.leave.kind]}</span>` : ''}<small>${esc(s.student_id)}${!s.active ? ' · ย้ายออกแล้ว' : ''}</small></div>
      <div class="seg">${btns}</div>${why}</div>`;
  }).join('');
  if (!R.canEdit) return;
  document.querySelectorAll('#stuList [data-s]').forEach(b => b.onclick = () => { const s = R.students[b.dataset.i]; s.status = b.dataset.s; S.dirty = true; renderStudents(); renderSum(); });
  document.querySelectorAll('#stuList [data-tap]').forEach(b => b.onclick = () => { const s = R.students[b.dataset.tap]; s.status = nextStatus(s); S.dirty = true; renderStudents(); renderSum(); });
  document.querySelectorAll('#stuList [data-why]').forEach(b => b.oninput = () => { R.students[b.dataset.why].reason = b.value; S.dirty = true; });
}
function renderSum() {
  const R = S.roster;
  const c = { M: {}, F: {}, T: {} };
  ['M','F','T'].forEach(g => ['total','present','late','absent','leave','wait'].forEach(k => c[g][k] = 0));
  R.students.forEach(s => ['T', s.gender].forEach(g => { c[g].total++; if (!s.status) { c[g].absent++; c[g].wait++; } else if (s.status === 'sick' || s.status === 'personal') c[g].leave++; else c[g][s.status]++; }));
  const row = (n, x) => `<tr ${n === 'รวม' ? 'class="tot"' : ''}><td>${n}</td><td class="num">${x.total}</td><td class="num" style="color:var(--ok)">${x.present}</td><td class="num" style="color:var(--late)">${x.late}</td><td class="num" style="color:var(--bad)">${x.absent}</td><td class="num" style="color:var(--sick)">${x.leave}</td></tr>`;
  $('sumBox').innerHTML = `<div class="row" style="margin-bottom:4px"><h3>ยอดประจำวัน (เรียลไทม์)</h3><span class="sp"></span><span class="chip st-present">มา ${c.T.present + c.T.late}/${c.T.total}</span></div>
    <table class="sumtbl"><thead><tr><th></th><th>เต็ม</th><th>ปกติ</th><th>สาย</th><th>ขาด</th><th>ลา</th></tr></thead>
    <tbody>${row('👦 ชาย', c.M)}${row('👧 หญิง', c.F)}${row('รวม', c.T)}</tbody></table>
    ${c.T.wait ? `<div class="sm" style="color:var(--bad);margin-top:4px">ยังไม่เช็ค ${c.T.wait} คน (นับเป็นขาดเรียน)</div>` : ''}`;
  if ($('saveInfo')) $('saveInfo').innerHTML = `<b>มา ${c.T.present + c.T.late}</b> · สาย ${c.T.late} · ขาด ${c.T.absent} · ลา ${c.T.leave}<br>` + (S.dirty ? '<span style="color:var(--late)">● ยังไม่บันทึก</span>' : '<span class="mut">บันทึกแล้ว</span>');
}
async function saveRoster(btn, finish) {
  const R = S.roster;
  const wait = R.students.filter(s => !s.status).length;
  const noWhy = R.students.find(s => (s.status === 'sick' || s.status === 'personal') && String(s.reason || '').trim().length < 2);
  if (noWhy) return toast(`✕ กรุณากรอกเหตุผลการลาของ ${noWhy.name}`, 5000);
  if (wait && !confirm(`ยังไม่ได้เช็ค ${wait} คน ระบบจะบันทึกเป็น "ขาดเรียน" ยืนยันหรือไม่?`)) return;
  if (finish && !confirm('ส่งยอดและจบภารกิจ? หลังจากนี้รหัส OTP จะใช้เข้าห้องนี้ไม่ได้อีก')) return;
  await run(btn, async () => {
    await api('saveAttendance', { classroom: R.classroom, day: R.day, finish, items: R.students.map(s => ({ student_id: s.student_id, status: s.status || 'absent', reason: s.reason || '' })) });
    S.dirty = false;
    if (finish) { await reloadMe(); toast('✓ ส่งยอดเรียบร้อย รหัส OTP หมดอายุแล้ว ขอบคุณครับ', 5000); return go('home'); }
    vRoom();
  }, finish ? '' : 'บันทึกการเช็คชื่อแล้ว');
}

/* ------------------ ตารางสรุป / ส่งออก ------------------ */
function statTable(r, day) {
  const cols = day ? ['total','present','late','absent','sick','personal','unchecked'] : ['student_days','present','late','absent','sick','personal'];
  const hd = day ? ['เต็ม','ปกติ','สาย','ขาด','ลาป่วย','ลากิจ','ยังไม่เช็ค'] : ['คน-วัน','ปกติ','สาย','ขาด','ลาป่วย','ลากิจ'];

}

const gasReady = () => !DEMO && !DEV && CONFIG.GAS_URL.indexOf('วาง_') < 0;
const inLine = () => !DEV && !DEMO && !!(window.liff && liff.isInClient && liff.isInClient());

function bindExport(params) {

async function doExport(fmt, params, rep) {
  if (fmt === 'drive') {
    const r = await gas({ action: 'export', format: 'pdf', params });
    toast(`✓ บันทึกสำเนาลง Google Drive ของโรงเรียนแล้ว (โฟลเดอร์ ${r.folder}${r.keepDays ? ` · เก็บ ${r.keepDays} วัน` : ''})`, 7000);
    return r;
  }
  if (inLine()) {   // เบราว์เซอร์ในแอป LINE ดาวน์โหลดไฟล์ไม่ได้ → เปิดเบราว์เซอร์ภายนอกที่หน้ารายงาน
    const u = location.origin + location.pathname + '?export=' + encodeURIComponent(JSON.stringify({ fmt, params }));
    liff.openWindow({ url: u, external: true });
    return toast('กำลังเปิดเบราว์เซอร์เพื่อดาวน์โหลดไฟล์...', 5000);
  }
  rep = rep || await api('exportData', params);

}

function fname(rep) { return (rep.title + '_' + rep.subtitle).replace(/[\\/:*?"<>|·]/g, ' ').replace(/\s+/g, '_').slice(0, 90).replace(/_+$/, ''); }
function saveBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function toXlsx(rep) {
  const wb = XLSX.utils.book_new();
  const aoa = [[rep.school], [rep.affiliation], [rep.title], [rep.subtitle], [rep.generated], []];
  rep.sections.forEach(s => { aoa.push([s.heading]); if (s.table) { aoa.push(s.table.cols); s.table.rows.forEach(r => aoa.push(r)); } if (s.kv) s.kv.forEach(k => aoa.push(k)); aoa.push([]); });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 14 }, { wch: 22 }, ...Array(10).fill({ wch: 10 })];
  ws['!pageSetup'] = { paperSize: 9, orientation: 'portrait', fitToWidth: 1 };
  XLSX.utils.book_append_sheet(wb, ws, 'รายงาน');
  XLSX.writeFile(wb, fname(rep) + '.xlsx');
  toast('✓ ดาวน์โหลด Excel แล้ว');
}
function repHtml(rep) {

  return `<div style="text-align:center">${rep.logo ? `<img src="${rep.logo}" style="width:64px;height:64px">` : ''}<div style="font-size:18pt;font-weight:700">${esc(rep.title)}</div>
    <div style="font-size:15pt;font-weight:700">${esc(rep.school)}</div><div>${esc(rep.affiliation)}</div><div>${esc(rep.subtitle)}</div><div style="font-size:11pt;color:#555">${esc(rep.generated)}</div></div>
    ${rep.sections.map(s => `<h3>${esc(s.heading)}</h3>${s.table ? tb(s.table) : ''}${s.kv ? s.kv.map(k => `<p><b>${esc(k[0])}:</b> ${esc(k[1])}</p>`).join('') : ''}`).join('')}

/* ---- สร้างไฟล์ Word (.docx) ในเครื่อง: เขียน XML ของ Word แล้วบีบเป็น zip เอง ไม่ต้องพึ่งเซิร์ฟเวอร์ ---- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {   // files: [[ชื่อ, Uint8Array]] → zip แบบไม่บีบอัด (Word เปิดได้ปกติ)
  const parts = [], cen = []; let off = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255], u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  for (const [name, data] of files) {
    const nb = new TextEncoder().encode(name), crc = crc32(data);
    const head = [...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)];
    parts.push(new Uint8Array(head), nb, data);
    cen.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
    off += head.length + nb.length + data.length;
  }
  const cenLen = cen.reduce((a, x) => a + x.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cenLen), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...cen, end], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
function docxXml(rep) {
  const x = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const run = (t, o = {}) => `<w:r><w:rPr>${o.b ? '<w:b/><w:bCs/>' : ''}${o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : ''}${o.color ? `<w:color w:val="${o.color}"/>` : ''}</w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
  const par = (runs, o = {}) => `<w:p><w:pPr>${o.keep ? '<w:keepNext/>' : ''}<w:spacing w:before="${o.before || 0}" w:after="${o.after ?? 0}"/>${o.jc ? `<w:jc w:val="${o.jc}"/>` : ''}</w:pPr>${runs}</w:p>`;
  const cell = (t, o = {}) => `<w:tc><w:tcPr>${o.w ? `<w:tcW w:w="${o.w}" w:type="dxa"/>` : ''}${o.fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>` : ''}${o.noBorder ? '<w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders>' : ''}</w:tcPr>${String(t).split('\n').map(l => par(run(l, { b: o.b, sz: o.sz || 26 }), { jc: o.jc })).join('')}</w:tc>`;
  const brd = '<w:tblBorders>' + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="777777"/>`).join('') + '</w:tblBorders>';
  const table = t => `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>${brd}<w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>
    <w:tr><w:trPr><w:tblHeader/></w:trPr>${t.cols.map((c, i) => cell(c, { b: 1, fill: 'EEEEEE', jc: (t.numeric || []).includes(i) ? 'right' : 'left' })).join('')}</w:tr>
    ${t.rows.map(r => r.concat(Array(Math.max(0, t.cols.length - r.length)).fill(''))).map((r, ri) => `<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((c, i) => cell(c ?? '', { b: (t.bold || []).includes(ri), fill: (t.bold || []).includes(ri) ? 'F3F4F6' : '', jc: (t.numeric || []).includes(i) ? 'right' : 'left' })).join('')}</w:tr>`).join('')}</w:tbl>${par('')}`;
  let body = '';
  body += par(run(rep.title, { b: 1, sz: 36 }), { jc: 'center' });
  body += par(run(rep.school, { b: 1, sz: 32 }), { jc: 'center' });
  if (rep.affiliation) body += par(run(rep.affiliation, { sz: 28 }), { jc: 'center' });
  body += par(run(rep.subtitle, { sz: 28 }), { jc: 'center' });
  body += par(run(rep.generated, { sz: 24, color: '555555' }), { jc: 'center', after: 120 });
  rep.sections.forEach(s => {
    body += par(run(s.heading, { b: 1, sz: 30 }), { before: 200, after: 60, keep: 1 });
    if (s.kv) s.kv.forEach(k => { body += par(run(k[0] + ': ', { b: 1 }) + run(k[1])); });
    if (s.table) body += table(s.table);
  });
  if ((rep.signatures || []).length) {
    const w = Math.floor(9600 / rep.signatures.length);
    body += par('', { before: 360 }) + `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders></w:tblPr><w:tr>${rep.signatures.map(n => cell(`ลงชื่อ ..............................\n(..............................)\n${n}`, { w, jc: 'center', noBorder: 1, sz: 28 })).join('')}</w:tr></w:tbl>`;
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="900" w:bottom="1000" w:left="1000" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="TH Sarabun New" w:hAnsi="TH Sarabun New" w:eastAsia="TH Sarabun New" w:cs="TH Sarabun New"/><w:sz w:val="30"/><w:szCs w:val="30"/><w:lang w:val="th-TH" w:bidi="th-TH"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
  return { doc, styles };
}
function toDocx(rep) {
  const { doc, styles } = docxXml(rep), enc = s => new TextEncoder().encode(s);
  const blob = zipStore([
    ['[Content_Types].xml', enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>')],
    ['_rels/.rels', enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')],
    ['word/_rels/document.xml.rels', enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>')],
    ['word/document.xml', enc(doc)],
    ['word/styles.xml', enc(styles)],
  ]);
  saveBlob(blob, fname(rep) + '.docx');
  toast('✓ ดาวน์โหลดไฟล์ Word แล้ว');
}

async function dashLoad() {
  const D = S.dash; const box = $('dBody');

  const params = { mode: D.mode, day: D.day, from: D.from || (ME.term && ME.term.start_day) || ME.today, to: D.to || ME.today, scope: D.scope };
  try {
    const d = await api('dashboard', params);
    const day = d.mode === 'day'; const T = d.totals.T;
    const k = (lbl, v, cls, sub) => `<div class="kpi ${cls}"><span>${lbl}</span><b class="num">${v}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;

function resizeImage(file, size) {
  return new Promise((ok, no) => {
    if (!/^image\//.test(file.type)) return no(new Error('กรุณาเลือกไฟล์รูปภาพ'));
    const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
      const s = Math.min(size / img.width, size / img.height); const w = img.width * s, h = img.height * s;
      x.clearRect(0, 0, size, size); x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      ok(c.toDataURL('image/png'));
    }; img.onerror = () => no(new Error('อ่านไฟล์รูปไม่ได้')); img.src = URL.createObjectURL(file);
  });
}

function downloadTemplate(cols, sample, name) {
  const ws = XLSX.utils.aoa_to_sheet([cols.map(c => c[1]), ...sample]);
  ws['!cols'] = cols.map(() => ({ wch: 20 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ข้อมูล');
  const help = XLSX.utils.aoa_to_sheet([['วิธีกรอก'], ['1. ห้ามเปลี่ยนชื่อหัวคอลัมน์แถวแรก'], ['2. กรอก 1 แถวต่อ 1 คน'], ['3. นำเข้าซ้ำได้ตลอดปี ระบบอัปเดตข้อมูลทันที (เพิ่ม/แก้ชื่อ/ย้ายห้อง)'], ['4. บันทึกเป็น .xlsx แล้วนำเข้าในแอป หรือใช้ Google Sheet แล้วดาวน์โหลดเป็น .xlsx']]);
  XLSX.utils.book_append_sheet(wb, help, 'วิธีกรอก');
  XLSX.writeFile(wb, name);
}
function readSheet(file, cols) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const wb = XLSX.read(r.result, { type: 'array', cellDates: false, raw: false });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
        const head = rows[0].map(h => String(h).trim());
        const idx = cols.map(([k, n]) => head.findIndex(h => h === n || h.split(' ')[0] === n.split(' ')[0]));
        const miss = cols.filter((c, i) => idx[i] < 0 && c[0] !== 'birth_date' && c[0] !== 'title');
        if (miss.length) throw new Error('ไฟล์ไม่ตรงเทมเพลต ไม่พบคอลัมน์: ' + miss.map(m => m[1]).join(', '));
        ok(rows.slice(1).map(r => Object.fromEntries(cols.map(([k], i) => [k, idx[i] >= 0 ? String(r[idx[i]] ?? '').trim() : '']))).filter(x => Object.values(x).some(v => v)));
      } catch (e) { no(e); }
    };
    r.onerror = () => no(new Error('อ่านไฟล์ไม่ได้')); r.readAsArrayBuffer(file);
  });
}

}

    <button class="btn pri" style="margin-top:12px" id="oGo">🎲 สุ่มรหัส</button><div id="oOut" style="margin-top:12px"></div></div>
    <div class="card"><h3>รหัสล่าสุด (7 วัน)</h3><ul class="list">${C.otps.map(o => { const st = o.revoked ? ['', 'ยกเลิก'] : o.done_at ? ['st-present', 'ใช้เสร็จแล้ว'] : o.used_by ? ['st-late', 'กำลังใช้: ' + tname(o.used_by)] : o.day < ME.today ? ['', 'หมดอายุ'] : ['st-sick', 'รอใช้'];
      return `<li class="row"><b class="num" style="font-size:18px;letter-spacing:3px">${esc(o.code)}</b><span class="sm">${esc(o.classroom)} · ${thDate(o.day)}${o.note ? ' · ' + esc(o.note) : ''}</span><span class="sp"></span><span class="chip ${st[0]}">${st[1]}</span>${!o.revoked && !o.done_at && o.day >= ME.today ? `<button class="btn sm" data-rvo="${o.id}">ยกเลิก</button>` : ''}</li>`; }).join('') || '<li class="mut">ยังไม่มี</li>'}</ul></div>`);
  $('oGo').onclick = e => run(e.target, async () => {
    const o = await api('genOtp', { classroom: $('oRoom').value, day: $('oDay').value, note: $('oNote').value });
    const msg = `รหัส OTP เช็คชื่อแทนห้อง ${o.classroom} วันที่ ${thDate(o.day)}: ${o.code}\nเปิดแอป > ใช้รหัส OTP${ME.school.name ? '\n' + ME.school.name : ''}`;
    $('oOut').innerHTML = `<div class="otpbig">${esc(o.code)}</div><p class="sm" style="text-align:center">ห้อง ${esc(o.classroom)} · ${thDate(o.day, true)}</p>
      <div class="row" style="justify-content:center"><button class="btn soft" id="oCopy">📋 คัดลอกข้อความ</button>${!DEMO && window.liff && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker') ? '<button class="btn soft" id="oShare">📤 ส่งทาง LINE</button>' : ''}</div>`;
    $('oCopy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(msg).then(() => toast('✓ คัดลอกแล้ว นำไปวางใน LINE ส่งให้ครูแทน')); };
    if ($('oShare')) $('oShare').onclick = () => liff.shareTargetPicker([{ type: 'text', text: msg }]);
    S.cfg = await api('adminConfig');
  });
  document.querySelectorAll('[data-rvo]').forEach(b => b.onclick = () => run(b, () => api('revokeOtp', { id: Number(b.dataset.rvo) }), 'ยกเลิกรหัสแล้ว').then(async () => { S.cfg = await api('adminConfig'); aOtp(); }));
}
function aBackup() {
  const C = S.cfg;
  const tl = x => x.term_no === 3 ? `ภาคฤดูร้อน ${x.year_be}` : `ภาคเรียนที่ ${x.term_no}/${x.year_be}`;
  aBody(`<div class="card pin"><h3>ขั้นที่ 1 สำรองข้อมูลภาคเรียนลง Google Sheet</h3>
    <ol class="sm" style="padding-left:18px"><li>เปิด Google Sheet "ระบบเช็คชื่อนักเรียน" ของโรงเรียน</li><li>เมนู <b>MallsofT › สำรองข้อมูลภาคเรียน</b> แล้วเลือกภาคเรียน</li><li>ระบบสร้างไฟล์สำรองใหม่ใน Google Drive (นักเรียน การเช็คชื่อทุกวัน การลา ปฏิทิน ครูที่ปรึกษา ผู้ปกครอง) เก็บเป็นหลักฐาน</li></ol>
    <ul class="list">${C.terms.map(x => `<li class="row"><b>${tl(x)}</b><span class="sp"></span>${x.archived_at ? `<span class="chip st-present">สำรองแล้ว ${thDate(String(x.archived_at).slice(0,10))}</span>${x.archive_url ? `<a class="btn sm" href="${esc(x.archive_url)}" target="_blank" rel="noopener">เปิดไฟล์</a>` : ''}` : '<span class="chip st-late">ยังไม่สำรอง</span>'}</li>`).join('')}</ul></div>
    <div class="card"><h3>ขั้นที่ 2 ล้างข้อมูลเพื่อเริ่มภาคเรียนใหม่</h3><p class="sm mut">ลบการเช็คชื่อ การลา ปฏิทิน รหัส OTP และครูที่ปรึกษาของภาคเรียนนั้น (รายชื่อนักเรียนและการจับคู่ผู้ปกครองยังอยู่ นำเข้าไฟล์ใหม่เพื่ออัปเดต) · ทำได้เฉพาะภาคเรียนที่สำรองแล้ว</p>
    <label class="f" for="pgTerm">ภาคเรียน</label><select id="pgTerm">${C.terms.filter(x => x.archived_at && !x.purged_at).map(x => `<option value="${x.id}" data-l="${esc(tl(x))}">${tl(x)}</option>`).join('') || '<option value="">— ยังไม่มีภาคเรียนที่สำรองแล้ว —</option>'}</select>
    <label class="row sm" style="margin-top:8px"><input type="checkbox" id="pgOut"> ลบนักเรียนที่ย้ายออกแล้วด้วย</label>
    <label class="f" for="pgConf">พิมพ์คำยืนยัน <b id="pgHint"></b></label><input type="text" id="pgConf">
    <button class="btn bad" style="margin-top:12px" id="pgGo">🗑 ล้างข้อมูลภาคเรียน</button></div>`);
  const hint = () => { const o = $('pgTerm').selectedOptions[0]; $('pgHint').textContent = o && o.dataset.l ? `ล้าง ${o.dataset.l}` : ''; };
  hint(); $('pgTerm').onchange = hint;
  $('pgGo').onclick = e => { if (!$('pgTerm').value) return toast('ต้องสำรองข้อมูลก่อน'); confirm('ยืนยันล้างข้อมูล? ย้อนกลับไม่ได้') && run(e.target, async () => { await api('purgeTerm', { termId: Number($('pgTerm').value), confirm: $('pgConf').value, removeMovedOut: $('pgOut').checked }); S.cfg = await api('adminConfig'); aBackup(); }, 'ล้างข้อมูลแล้ว'); };
}

boot();
</script>
<script>
/* ---- โหมดสาธิตบนเว็บไซต์: หน้าต่างยืนยัน/ดาวน์โหลดถูกแทนด้วยตัวอย่างในแอป ---- */
window.confirm = () => true;
window.prompt = (m, d) => (d == null ? 'ทดสอบจากโหมดสาธิต' : d);
function demoPreview(rep, kind) {
  modal(`<div class="row"><h2>ตัวอย่างไฟล์ ${kind}</h2><span class="sp"></span><button class="btn sm" onclick="closeModal()">ปิด</button></div>
  <p class="sm mut">ในระบบจริงจะดาวน์โหลดเป็นไฟล์ ${kind} ขนาด A4 ลงเครื่อง</p>
  <div style="background:#fff;color:#000;border:1px solid #ccc;border-radius:6px;padding:18px;font-family:Sarabun,sans-serif;font-size:12px;overflow:auto;max-height:60vh" class="a4p">${repHtml(rep)}</div>
  <style>.a4p table{border-collapse:collapse;width:100%;margin:6px 0}.a4p th,.a4p td{border:1px solid #888;padding:2px 5px;color:#000}.a4p th{background:#eee}.a4p h3{font-size:14px;margin:12px 0 4px;color:#000}</style>`);
}
window.print = () => toast('โหมดสาธิต: ในระบบจริงจะเปิดหน้าต่างบันทึกเป็น PDF ขนาด A4', 5000);
toDocx = rep => demoPreview(rep, 'Word (.docx)');
toXlsx = rep => demoPreview(rep, 'Excel');
downloadTemplate = (cols, sample, name) => modal(`<h2>เทมเพลต ${esc(name)}</h2><p class="sm mut">ในระบบจริงจะดาวน์โหลดเป็นไฟล์ Excel หัวคอลัมน์ดังนี้</p><div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${sample.slice(0,5).map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="btn full" style="margin-top:12px" onclick="closeModal()">ปิด</button>`);
</script>
</body>
